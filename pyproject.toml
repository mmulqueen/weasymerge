[project]
name = "weasymerge"
version = "0.1.0"
description = "Mail merge and bulk document generation from CSV to PDF using WeasyPrint and Jinja2."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Michael Mulqueen" },
]
maintainers = [
    { name = "Michael Mulqueen" },
]
keywords = [
    "mail-merge",
    "pdf",
    "weasyprint",
    "jinja2",
    "document-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
dependencies = [
    "weasyprint",
    "jinja2",
    "pystrich>=0.15",
]

[project.urls]
Homepage = "https://github.com/mmulqueen/weasymerge"
Repository = "https://github.com/mmulqueen/weasymerge"
Issues = "https://github.com/mmulqueen/weasymerge/issues"

[project.scripts]
weasymerge = "weasymerge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/weasymerge"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pypdf>=4",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore_missing_imports = true
