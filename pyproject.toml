[project]
name = "weasymerge"
version = "0.1.0"
description = "Mail merge from CSV to PDF using WeasyPrint and Jinja2."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "weasyprint",
    "jinja2",
]

[project.scripts]
weasymerge = "weasymerge:main"

[project.optional-dependencies]
barcodes = [
    "pystrich>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/weasymerge"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pypdf>=4",
    "ruff>=0.7",
    "mypy>=1.11",
    "pystrich>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore_missing_imports = true
